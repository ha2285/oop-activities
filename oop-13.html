<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Java OOP Interactive Comparison</title><style>body{font:15px system-ui,sans-serif;background:#f7f8fb;color:#172033;margin:0;padding:24px}.wrap{max-width:1150px;margin:auto;background:white;border:1px solid #dfe4eb;border-radius:16px;padding:24px}h1{font-size:23px;margin:0}p{color:#657084}.diagrams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:22px 0}.panel{border:1px solid #dfe4eb;border-radius:12px;padding:12px;min-height:190px}.panel h3{text-align:center;margin:0 0 15px;font-size:16px}.uml{border:1.5px solid #364458;border-radius:4px;max-width:230px;margin:auto;text-align:center}.uml .head{padding:10px;background:#eef2f8}.uml .body{text-align:left;border-top:1px solid #364458;padding:10px;font-family:monospace;font-size:12px}.uml small{display:block;color:#657084}.note{text-align:center;font-size:12px;color:#435169;margin:10px 0}.empty{display:grid;place-items:center;height:140px;color:#a3adba;background:#f4f6f9;border-radius:8px}svg{display:block;margin:auto;max-width:100%}table{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}th,td{padding:13px 10px;border-radius:5px;text-align:left;font-size:13px;vertical-align:middle}th{background:#e9edf4}td{border:1px solid #e0e5ed;height:45px}td:first-child{background:#eef1f6;font-weight:650;width:17%}.current{outline:2px solid #4b70c8}.hidden{background:#f4f6f9;color:#bac3ce;text-align:center}.controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}button{border:1px solid #cbd4e2;background:white;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:600}button.primary{background:#285ec2;color:white;border-color:#285ec2}button:disabled{opacity:.35;cursor:not-allowed}@media(max-width:650px){body{padding:8px}.wrap{padding:10px}.diagrams{gap:5px}.panel{padding:5px}.panel h3{font-size:12px}.uml .head,.uml .body{padding:5px;font-size:10px}th,td{padding:6px 3px;font-size:10px}}</style><div class="wrap"><h1>Java OOP — Interactive Comparison</h1><p>Each click reveals one cell. Examples accumulate across the current row.</p><div class="diagrams" id="diagrams"></div><table><thead><tr><th>Feature</th><th>Concrete Class</th><th>Abstract Class</th><th>Interface</th></tr></thead><tbody id="comparison"></tbody></table><div class="controls"><button id="prev">← Previous</button><span><button id="reset">Reset</button> <button id="all">Show all</button> <button class="primary" id="next">Next →</button></span></div><p id="status"></p></div><script>
const names=['Concrete Class','Abstract Class','Interface'];
const rows=[['Methods',['All methods are implemented.','May contain abstract and implemented methods.','May declare abstract methods and provide default, static and private methods.']],['Object creation',['Can instantiate directly.','Cannot instantiate directly.','Cannot instantiate directly.']],['Inheritance',['A class extends one superclass.','An abstract class extends one superclass.','An interface can extend multiple interfaces.']],['Using in a class',['A subclass extends a concrete class.','A subclass extends an abstract class.','A class implements one or more interfaces.']],['Purpose',['Complete implementation.','Shared code and partial abstraction.','Defines a behavior contract.']]];
const data=[[["Animal","class",["+ sound(): void"],"Implemented method"],["Animal","abstract",["+ sound(): void {abstract}","+ move(): void"],"Abstract + implemented"],["Soundable","interface",["+ sound(): void"],"Behavior contract"]],[["Animal","class",["+ Animal()"],"new Animal() ✓"],["Animal","abstract",["+ sound(): void {abstract}"],"new Animal() ✕"],["Soundable","interface",["+ sound(): void"],"new Soundable() ✕"]],[["Animal","class",["+ eat(): void"],"class Dog extends Animal","Dog"],["Animal","abstract",["+ sound(): void {abstract}"],"class Dog extends Animal","Dog"],["SmartPet","multiple",["+ play(): void"],"SmartPet extends Movable, Soundable"]],[["Animal","class",["+ eat(): void"],"class Dog extends Animal","Dog"],["Animal","abstract",["+ sound(): void {abstract}"],"class Dog extends Animal","Dog"],["Soundable","interface",["+ sound(): void"],"class Dog implements Soundable","Dog"]],[["Animal","class",["+ sound(): void"],"Ready-to-use objects"],["Animal","abstract",["+ sound(): void {abstract}"],"Shared template"],["Soundable","interface",["+ sound(): void"],"Common contract"]]];
let pos=0,showAll=false;
function diagram(d,r,c){if(r===2&&c===2)return `<svg viewBox="0 0 240 220" aria-label="SmartPet interface extends Movable and Soundable interfaces"><rect x="3" y="8" width="104" height="52" rx="4" fill="#eef2f8" stroke="#364458"/><text x="55" y="24" text-anchor="middle" font-size="10">«interface»</text><text x="55" y="43" text-anchor="middle" font-size="14">Movable</text><rect x="133" y="8" width="104" height="52" rx="4" fill="#eef2f8" stroke="#364458"/><text x="185" y="24" text-anchor="middle" font-size="10">«interface»</text><text x="185" y="43" text-anchor="middle" font-size="14">Soundable</text><path d="M120 140 V107 H55 V62 M120 107 H185 V62" fill="none" stroke="#364458" stroke-width="2"/><path d="M55 62 L45 82 L65 82 Z M185 62 L175 82 L195 82 Z" fill="white" stroke="#364458" stroke-width="2"/><rect x="50" y="140" width="140" height="60" rx="4" fill="#eef2f8" stroke="#364458"/><text x="120" y="157" text-anchor="middle" font-size="10">«interface»</text><text x="120" y="175" text-anchor="middle" font-size="15" font-weight="bold">SmartPet</text><text x="120" y="190" text-anchor="middle" font-size="11">+ play(): void</text></svg><div class="note">interface SmartPet extends Movable, Soundable</div>`;
let s=`<div class="uml"><div class="head"><small>«${d[1]}»</small><strong>${d[0]}</strong></div><div class="body">${d[2].join('<br>')}</div></div>`;if(d[4])s+=`<svg viewBox="0 0 160 85" width="120" height="75" aria-label="${d[4]} inherits from ${d[0]}"><path d="M80 84 V27 M80 4 L65 27 L95 27 Z" stroke="#364458" stroke-width="2" fill="white" ${d[1]==='interface'?'stroke-dasharray="5 4"':''}/></svg><div class="uml"><div class="head"><strong>${d[4]}</strong></div></div>`;return s+`<div class="note">${d[3]}</div>`}
function render(){const r=Math.floor(pos/3),c=pos%3;document.getElementById('diagrams').innerHTML=names.map((n,j)=>`<section class="panel"><h3>${n}</h3>${showAll||j<=c?diagram(data[r][j],r,j):'<div class="empty">Not revealed</div>'}</section>`).join('');document.getElementById('comparison').innerHTML=rows.map((row,i)=>showAll||i<=r?`<tr><td>${row[0]}</td>${row[1].map((v,j)=>`<td class="${!showAll&&pos===i*3+j?'current':''} ${!showAll&&i*3+j>pos?'hidden':''}" ${showAll||i*3+j<=pos?`onclick="pos=${i*3+j};showAll=false;render()" style="cursor:pointer"`:''}>${showAll||i*3+j<=pos?v:'—'}</td>`).join('')}</tr>`:'').join('');document.getElementById('status').textContent=`${showAll?'All 15 cells revealed':`Step ${pos+1} of 15 — ${rows[r][0]} / ${names[c]}`}`;document.getElementById('prev').disabled=pos===0&&!showAll;document.getElementById('next').disabled=pos===14||showAll}
document.getElementById('next').onclick=()=>{pos=Math.min(14,pos+1);render()};document.getElementById('prev').onclick=()=>{showAll=false;pos=Math.max(0,pos-1);render()};document.getElementById('reset').onclick=()=>{pos=0;showAll=false;render()};document.getElementById('all').onclick=()=>{showAll=true;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!showAll){pos=Math.min(14,pos+1);render()}if(e.key==='ArrowLeft'){showAll=false;pos=Math.max(0,pos-1);render()}});render();
</script></html>
